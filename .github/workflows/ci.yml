name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal --component clippy --component rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: windows
          cache-on-failure: true
          save-if: ${{ github.ref_name == github.event.repository.default_branch || startsWith(github.ref, 'refs/tags/v') }}
      - name: Fetch FFmpeg
        shell: pwsh
        run: ./scripts/fetch-ffmpeg.ps1
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - name: Warm the release profile cache
        if: github.ref_name == github.event.repository.default_branch || startsWith(github.ref, 'refs/tags/v')
        run: cargo build --release

  audit:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: audit
          save-if: ${{ github.ref_name == github.event.repository.default_branch }}
      - run: cargo install cargo-audit --locked
      - run: cargo audit

  release:
    needs: [check, audit]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: windows
          save-if: false
      - name: Check the tag matches the crate version
        shell: bash
        run: |
          crate_version=$(cargo metadata --no-deps --format-version 1 | python -c "import json,sys; print(json.load(sys.stdin)['packages'][0]['version'])")
          if [ "v$crate_version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match Cargo.toml version $crate_version"
            exit 1
          fi
      - name: Fetch FFmpeg
        shell: pwsh
        run: ./scripts/fetch-ffmpeg.ps1
      - run: cargo test --release
      - run: cargo build --release
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory replay-library | Out-Null
          Copy-Item target/release/replay-library.exe replay-library
          Copy-Item third_party/ffmpeg/bin/*.dll replay-library
          Copy-Item third_party/ffmpeg/bin/ffmpeg.exe replay-library
          Copy-Item third_party/ffmpeg/LICENSE.txt replay-library
          Copy-Item LICENSE-MIT, LICENSE-APACHE replay-library
          Copy-Item assets/fonts/*.txt replay-library
          Compress-Archive -Path replay-library/* -DestinationPath replay-library-windows-x64.zip
          (Get-FileHash replay-library-windows-x64.zip -Algorithm SHA256).Hash.ToLower() + "  replay-library-windows-x64.zip" | Out-File -Encoding ascii replay-library-windows-x64.zip.sha256
      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" replay-library-windows-x64.zip replay-library-windows-x64.zip.sha256 --title "$GITHUB_REF_NAME" --generate-notes
