[package]
name = "replay-library"
version = "1.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
anyhow = "1"
cpal = "0.18.2"
ffmpeg-next = "=9.0.0"
gpui = "0.2.2"
image = "0.25"
notify = "8"
serde = { version = "1", features = ["derive"] }
toml = "1.2.1"

[target."cfg(windows)".dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Registry", "Win32_UI_Shell", "Win32_System_Com", "Win32_System_Time", "Win32_System_Threading"] }

[build-dependencies]
winresource = "0.1.34"

[profile.release]
lto = "thin"
codegen-units = 1
